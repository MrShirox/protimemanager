name: protimemanager
description: Gestionnaire de temps de travail
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.0
  provider: ^6.1.2
  sqflite: ^2.3.2
  path: ^1.9.0
  home_widget: ^0.6.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  flutter_timezone: ^5.1.1
  timezone: ^0.9.4
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
